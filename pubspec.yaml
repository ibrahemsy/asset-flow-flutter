name: asset_flow_flutter
description: نظام إدارة الأصول والعهدة - دائرة الاتصالات - وزارة الطوارئ وإدارة الكوارث
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.2

  # Supabase
  supabase_flutter: ^2.8.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # QR & Barcode & Images
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2

  # Excel / Sheets
  excel: ^4.0.6
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  share_plus: ^10.1.3

  # Networking & AI
  http: ^1.2.2
  dio: ^5.7.0

  # Others
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
