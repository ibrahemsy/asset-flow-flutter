name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/firebase-rules-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Web and Android platform scaffolding
        run: flutter create --platforms=web,android --no-pub . && rm -f test/widget_test.dart

      - name: Align Android compile SDK with plugin requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          files = [path for path in candidates if path.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")
          path = files[0]
          content = path.read_text()
          updated = re.sub(
              r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion",
              "compileSdk = 36",
              content,
          )
          updated = re.sub(
              r"compileSdkVersion\\s+flutter\\.compileSdkVersion",
              "compileSdkVersion 36",
              updated,
          )
          if updated == content and not re.search(r"compileSdk(?:Version)?\\s*(?:=\\s*)?36", content):
              raise SystemExit(f"Could not safely set compileSdk 36 in {path}")
          path.write_text(updated)
          print(f"Configured compileSdk 36 in {path}")
          PY
          yes | sdkmanager "platforms;android-36"
          
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install and type-check Firebase Functions
        working-directory: functions
        run: npm install && npm run lint
