name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/firebase-rules-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Web platform scaffolding
        run: flutter create --platforms=web --no-pub . && rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Set up Node.js for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install and type-check Firebase Functions
        working-directory: functions
        run: npm install && npm run lint

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install and type-check Firebase Functions
        working-directory: functions
        run: npm install && npm run lint
