name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/firebase-rules-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Web platform scaffolding
        run: flutter create --platforms=web --no-pub .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --debug
