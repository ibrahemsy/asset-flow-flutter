name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/firebase-rules-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --platforms=web,android,ios,windows,linux,macos --no-pub .

      - name: Remove generated placeholder test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart && ! grep -q "class MyApp" lib/main.dart; then
            rm test/widget_test.dart
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  build-platforms:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            platform: web
            os: ubuntu-latest
          - name: Android
            platform: android
            os: ubuntu-latest
          - name: Windows desktop
            platform: windows
            os: windows-latest
          - name: Linux desktop
            platform: linux
            os: ubuntu-latest
          - name: macOS and iOS
            platform: apple
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Generate platform scaffolding
        shell: bash
        run: flutter create --platforms=web,android,ios,windows,linux,macos --no-pub .

      - name: Align Android compile SDK with plugin requirements
        if: matrix.platform == 'android'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          files = [path for path in candidates if path.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")

          path = files[0]
          content = path.read_text()
          replacements = (
              ("compileSdk = flutter.compileSdkVersion", "compileSdk = 36"),
              ("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36"),
          )
          updated = content
          for source, target in replacements:
              updated = updated.replace(source, target)

          if updated == content and "compileSdk = 36" not in content and "compileSdkVersion 36" not in content:
              raise SystemExit(f"Could not safely set compileSdk 36 in {path}")

          path.write_text(updated)
          print(f"Configured compileSdk 36 in {path}")
          PY
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" </dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        if: matrix.platform == 'web'
        run: flutter build web --release

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug

      - name: Build Windows desktop
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux desktop
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build macOS desktop
        if: matrix.platform == 'apple'
        run: flutter build macos --release

      - name: Build iOS (unsigned)
        if: matrix.platform == 'apple'
        run: flutter build ios --release --no-codesign

      - name: Upload Web artifact
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK artifact
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows desktop artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux desktop artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS and iOS artifacts
        if: matrix.platform == 'apple'
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-macos-and-ios-unsigned
          path: |
            build/macos/Build/Products/Release/
            build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: 14

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install and type-check Firebase Functions
        working-directory: functions
        run: npm install && npm run lint
