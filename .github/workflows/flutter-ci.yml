name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/firebase-rules-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Web and Android platform scaffolding
        run: flutter create --platforms=web,android --no-pub . && rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install and type-check Firebase Functions
        working-directory: functions
        run: npm install && npm run lint
