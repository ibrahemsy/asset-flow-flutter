name: Deploy Firebase security and admin functions

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY to deploy Firestore rules and Cloud Functions to the configured Firebase project"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install and build Cloud Functions
        working-directory: functions
        run: npm install && npm run build

      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing FIREBASE_SERVICE_ACCOUNT secret" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate Firebase project configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || (echo "Missing production environment variable FIREBASE_PROJECT_ID" && exit 1)
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules,functions --non-interactive
