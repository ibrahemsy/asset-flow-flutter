name: Flutter validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/supabase-admin-handover]
  workflow_dispatch:

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pin Flutter to Java 21
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Flutter version
        run: flutter --version

      - name: Clean stale Flutter plugin registrants
        run: flutter clean

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-web
          path: build/web/
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios-unsigned:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffolding
        run: flutter create --platforms=ios --org com.ibrahemsy .

      - name: Set iOS deployment target for camera scanner
        run: |
          ruby -0pi -e "gsub(/^# platform :ios, '13\\.0'/, \"platform :ios, '15.5'\")" ios/Podfile
          grep -n "platform :ios" ios/Podfile

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-ios-project
          path: ios/
          if-no-files-found: error
