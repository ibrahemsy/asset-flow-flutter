name: Flutter validation

on:
  push:
    branches: [main, feature/supabase-admin-handover]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android and Web platform runners
        run: flutter create . --platforms=android,web --org com.ibrahemsy

      - name: Commit generated platform runners to feature branch
        if: github.ref_name == 'feature/supabase-admin-handover'
        run: |
          if [ -n "$(git status --porcelain android web)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android web
            git commit -m "build: generate Flutter Android and Web platform runners"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-web
          path: build/web/
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
